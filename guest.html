<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guests &mdash; A5 Boyzz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar">&#9776;</button>
    <div class="sidebar-brand">
      <a class="sidebar-logo" href="index.html">A5 Boyzz 🏠</a>
      <div class="sidebar-sub">Flat A5 &mdash; Since July 2022</div>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html">
        <span class="nav-icon">🏠</span><span class="nav-label">Home</span>
      </a>
      <a href="guest.html" class="active">
        <span class="nav-icon">👋</span><span class="nav-label">Guests</span>
      </a>
      <a href="games.html">
        <span class="nav-icon">🎮</span><span class="nav-label">Games</span>
      </a>
    </nav>
    <div class="sidebar-footer">Built with ❤️ by A5 squad</div>
  </aside>

  <!-- MAIN -->
  <div class="main" id="main">
    <div class="page-wrap">

      <div class="page-header">
        <h1>👋 Guest Entry</h1>
        <p>Let us know who you are and who you're here to visit.</p>
      </div>

      <div class="form-card" id="form-card">
        <form id="guest-form">
          <div class="form-group">
            <label for="guest-name">Your Name</label>
            <input type="text" id="guest-name" placeholder="e.g. Rahul Sharma" required autocomplete="off" />
          </div>

          <div class="form-group">
            <label for="visiting">Here to meet</label>
            <select id="visiting" required>
              <option value="" disabled selected>Select a roommate…</option>
            </select>
          </div>

          <div class="form-group">
            <label for="relation">Your relation</label>
            <input type="text" id="relation" placeholder="e.g. College friend, Cousin…" required autocomplete="off" />
          </div>

          <button type="submit" class="btn btn-primary form-submit">Check In &rarr;</button>
        </form>
      </div>

      <div class="success-card" id="success-card">
        <div class="success-icon">🎉</div>
        <h2 id="success-title">Welcome!</h2>
        <p id="success-msg"></p>
        <br />
        <a href="guest.html" class="btn btn-outline" style="margin-right:0.5rem">New Entry</a>
        <a href="index.html" class="btn btn-primary">Go Home</a>
      </div>

    </div>

    <footer>
      <p>A5 Boyzz Portal</p>
    </footer>
  </div>

  <script>
    const sidebar = document.getElementById('sidebar');
    document.getElementById('sidebar-toggle').addEventListener('click', () => {
      const collapsed = sidebar.classList.toggle('collapsed');
      document.body.classList.toggle('sidebar-collapsed', collapsed);
      localStorage.setItem('sidebarCollapsed', collapsed);
    });
    if (localStorage.getItem('sidebarCollapsed') === 'true') {
      sidebar.classList.add('collapsed');
      document.body.classList.add('sidebar-collapsed');
    }

    async function loadData() {
      const res = await fetch('data/roommates.json');
      return res.json();
    }

    loadData().then(data => {
      const sel = document.getElementById('visiting');
      data.roommates.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r.id;
        opt.textContent = `${r.emoji} ${r.name} (${r.nickname})`;
        sel.appendChild(opt);
      });

      document.getElementById('guest-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const name     = document.getElementById('guest-name').value.trim();
        const relation = document.getElementById('relation').value.trim();
        const mate     = data.roommates.find(r => r.id === parseInt(sel.value));

        const log = JSON.parse(localStorage.getItem('a5_guests') || '[]');
        log.push({ guestName: name, relation, visiting: mate.name, checkedInAt: new Date().toLocaleString() });
        localStorage.setItem('a5_guests', JSON.stringify(log));

        document.getElementById('form-card').style.display = 'none';
        const card = document.getElementById('success-card');
        card.classList.add('show');
        document.getElementById('success-title').textContent = `Hey ${name}! 👋`;
        document.getElementById('success-msg').textContent =
          `You're checked in as ${mate.name}'s ${relation}. Welcome to Flat A5!`;
      });
    });
  </script>

</body>
</html>
